<!doctype html>
<html><head><meta charset="utf-8"><title>CC Assistant Browser Bridge</title>
<style>body{font:14px system-ui;max-width:680px;margin:48px auto;padding:0 20px}label{display:block;margin:18px 0 6px}input{width:100%;padding:9px;box-sizing:border-box}button{margin-top:20px;padding:9px 14px}#status{margin-left:12px}</style></head>
<body><h1>CC Assistant Browser Bridge</h1><p>The token stays in Chrome extension storage and is sent only to your local daemon.</p>
<label for="url">Daemon URL</label><input id="url" value="http://127.0.0.1:4317">
<label for="token">Access token</label><input id="token" type="password" autocomplete="off">
<button id="save">Save and test</button><span id="status"></span><script src="options.js"></script></body></html>
