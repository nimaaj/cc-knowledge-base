    const byId = new Map(nodes.map((node) =&gt; [node.id, node]));
    let selectedId = &quot;memory&quot;;
    let frameToken = 0;
    const ns = &quot;http://www.w3.org/2000/svg&quot;;

    function el(name, attributes = {}) {
      const element = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
      return element;
    }

    function showDetail(id) {
      const node = byId.get(id);
      if (!node) return;
      selectedId = selectedId === id &amp;&amp; !detail.hidden ? null : id;
      if (!selectedId) {
        detail.hidden = true;
        draw();
        return;
      }
      detail.hidden = false;
      detailLane.textContent = lanes[node.lane];
      detailTitle.textContent = node.label;
      detailSummary.textContent = node.summary;
      detailSteps.replaceChildren(...node.steps.map((step) =&gt; {
        const item = document.createElement(&quot;li&quot;);
        item.textContent = step;
        return item;
      }));
      detailSource.replaceChildren();
      const code = document.createElement(&quot;code&quot;);
      code.textContent = node.source;
      detailSource.append(&quot;Source: &quot;, code);
      draw();
    }

    closeButton.addEventListener(&quot;click&quot;, () =&gt; {
      selectedId = null;
      detail.hidden = true;
      draw();
    });

    function nodePosition(id, width, compact) {
      const laneWidth = width / 5;
      const center = (lane) =&gt; laneWidth * (lane + 0.5);
      if (!compact) {
        const wide = {
          start: [center(0), 92, 112, 48], entry: [center(0), 172, 146, 58],
          auth: [center(1), 172, 132, 82], reject: [center(1), 286, 136, 48],
          validate: [center(2), 172, 150, 58], route: [center(2), 286, 136, 82],
          memory: [center(2), 410, 150, 58], tasks: [center(2), 510, 150, 58],
          runs: [center(2), 610, 150, 58], automation: [center(2), 710, 150, 58],
          browser: [center(2), 810, 150, 58], memoryState: [center(3), 410, 154, 60],
          taskState: [center(3), 510, 154, 60], approval: [center(3), 610, 138, 82],
          scheduleState: [center(3), 710, 154, 60], jobState: [center(3), 810, 154, 60],
          apiResult: [center(4), 410, 148, 58], uiResult: [center(4), 510, 148, 58],
          approvalQueue: [center(4), 575, 148, 54], execution: [center(4), 655, 148, 58],
          reminder: [center(4), 735, 148, 58], adapter: [center(4), 815, 148, 58],
          end: [center(4), 920, 154, 52]
        };
        const raw = wide[id];
        const maxWidth = Math.max(88, laneWidth - 20);
        return { x: raw[0], y: raw[1], w: Math.min(raw[2], maxWidth), h: raw[3] };
      }
      const centerX = width / 2;
      const compactY = {
        start: 68, entry: 145, auth: 235, reject: 345, validate: 440, route: 540,
        memory: 675, memoryState: 755, apiResult: 835,
        tasks: 960, taskState: 1040, uiResult: 1120,
        runs: 1245, approval: 1335, approvalQueue: 1430, execution: 1515,
        automation: 1640, scheduleState: 1720, reminder: 1800,
        browser: 1925, jobState: 2005, adapter: 2085, end: 2205
      };
      const wideNode = Math.min(224, width - 44);
      const narrowNode = Math.min(190, width - 70);
      const node = byId.get(id);
      const compactX = id === &quot;reject&quot; ? width * 0.32 : id === &quot;validate&quot; ? width * 0.68 : centerX;
      const compactWidth = id === &quot;reject&quot;
        ? Math.min(132, width * 0.43)
        : id === &quot;validate&quot;
          ? Math.min(164, width * 0.5)
          : node.type === &quot;decision&quot;
            ? narrowNode
            : wideNode;
      return {
        x: compactX,
        y: compactY[id],
        w: compactWidth,
        h: node.type === &quot;decision&quot; ? 78 : node.type === &quot;start&quot; || node.type === &quot;end&quot; || node.type === &quot;reject&quot; ? 50 : 58
      };
    }

    function anchor(position, side) {
      if (side === &quot;left&quot;) return [position.x - position.w / 2, position.y];
      if (side === &quot;right&quot;) return [position.x + position.w / 2, position.y];
      if (side === &quot;top&quot;) return [position.x, position.y - position.h / 2];
      return [position.x, position.y + position.h / 2];
    }

    function addPath(layer, d, marker = true, className = &quot;flow-edge&quot;) {
      const path = el(&quot;path&quot;, { d, class: className });
      if (marker) path.setAttribute(&quot;marker-end&quot;, &quot;url(#cc-flow-arrow)&quot;);
      layer.append(path);
      return path;
    }

    function addLabel(layer, text, x, y) {
      const label = el(&quot;text&quot;, { x, y, class: &quot;edge-label&quot;, &quot;text-anchor&quot;: &quot;middle&quot; });
      label.textContent = text;
      layer.append(label);
    }

    function connect(layer, positions, fromId, toId, label) {
      const from = positions.get(fromId);
      const to = positions.get(toId);
      if (!from || !to) return;
      let d;
      let lx;
      let ly;
      if (Math.abs(from.x - to.x) &lt; 4) {
        const [sx, sy] = anchor(from, &quot;bottom&quot;);
        const [tx, ty] = anchor(to, &quot;top&quot;);
        d = `M ${sx} ${sy} V ${ty}`;
        lx = sx + 16;
        ly = (sy + ty) / 2;
      } else {
        const movingRight = to.x &gt; from.x;
        const [sx, sy] = anchor(from, movingRight ? &quot;right&quot; : &quot;left&quot;);
        const [tx, ty] = anchor(to, movingRight ? &quot;left&quot; : &quot;right&quot;);
        const mx = (sx + tx) / 2;
        d = `M ${sx} ${sy} H ${mx} V ${ty} H ${tx}`;
        lx = mx;
        ly = sy - 6;
      }
      addPath(layer, d);
      if (label) addLabel(layer, label, lx, ly);
    }

    function drawWideEdges(layer, positions, width) {
      connect(layer, positions, &quot;start&quot;, &quot;entry&quot;);
      connect(layer, positions, &quot;entry&quot;, &quot;auth&quot;);
      connect(layer, positions, &quot;auth&quot;, &quot;reject&quot;, &quot;No&quot;);
      connect(layer, positions, &quot;auth&quot;, &quot;validate&quot;, &quot;Yes&quot;);
      connect(layer, positions, &quot;validate&quot;, &quot;route&quot;);

      const route = positions.get(&quot;route&quot;);
      const memory = positions.get(&quot;memory&quot;);
      const browserNode = positions.get(&quot;browser&quot;);
      const branchX = route.x - route.w / 2 - 14;
      addPath(layer, `M ${route.x} ${route.y + route.h / 2} V ${route.y + route.h / 2 + 18} H ${branchX} V ${browserNode.y}`, false, &quot;flow-trunk&quot;);
      [&quot;memory&quot;, &quot;tasks&quot;, &quot;runs&quot;, &quot;automation&quot;, &quot;browser&quot;].forEach((id) =&gt; {
        const target = positions.get(id);
        addPath(layer, `M ${branchX} ${target.y} H ${target.x - target.w / 2}`);
      });

      connect(layer, positions, &quot;memory&quot;, &quot;memoryState&quot;);
      connect(layer, positions, &quot;tasks&quot;, &quot;taskState&quot;);
      connect(layer, positions, &quot;runs&quot;, &quot;approval&quot;);
      connect(layer, positions, &quot;automation&quot;, &quot;scheduleState&quot;);
      connect(layer, positions, &quot;browser&quot;, &quot;jobState&quot;);
      connect(layer, positions, &quot;memoryState&quot;, &quot;apiResult&quot;);
      connect(layer, positions, &quot;taskState&quot;, &quot;uiResult&quot;);
      connect(layer, positions, &quot;approval&quot;, &quot;approvalQueue&quot;, &quot;Yes&quot;);
      connect(layer, positions, &quot;approval&quot;, &quot;execution&quot;, &quot;No&quot;);
      connect(layer, positions, &quot;approvalQueue&quot;, &quot;execution&quot;, &quot;Approved&quot;);
      connect(layer, positions, &quot;scheduleState&quot;, &quot;reminder&quot;);
      connect(layer, positions, &quot;jobState&quot;, &quot;adapter&quot;);

      const end = positions.get(&quot;end&quot;);
      const laneWidth = width / 5;
      const mergeX = width - Math.max(8, laneWidth * 0.04);
      const outputIds = [&quot;apiResult&quot;, &quot;uiResult&quot;, &quot;execution&quot;, &quot;reminder&quot;, &quot;adapter&quot;];
      const first = positions.get(outputIds[0]);
      addPath(layer, `M ${mergeX} ${first.y} V ${end.y}`, false, &quot;flow-trunk&quot;);
      outputIds.forEach((id) =&gt; {
        const output = positions.get(id);
        addPath(layer, `M ${output.x + output.w / 2} ${output.y} H ${mergeX}`, false, &quot;flow-trunk&quot;);
      });
      addPath(layer, `M ${mergeX} ${end.y} H ${end.x + end.w / 2}`);
    }

    function drawCompactEdges(layer, positions, width) {
      const ordered = [
        [&quot;start&quot;, &quot;entry&quot;], [&quot;entry&quot;, &quot;auth&quot;], [&quot;auth&quot;, &quot;reject&quot;, &quot;No&quot;],
        [&quot;auth&quot;, &quot;validate&quot;, &quot;Yes&quot;], [&quot;validate&quot;, &quot;route&quot;]
      ];
      ordered.forEach(([from, to, label]) =&gt; connect(layer, positions, from, to, label));
      const route = positions.get(&quot;route&quot;);
      const branchX = 14;
      const lastBranch = positions.get(&quot;browser&quot;);
      addPath(layer, `M ${route.x} ${route.y + route.h / 2} V ${route.y + route.h / 2 + 18} H ${branchX} V ${lastBranch.y}`, false, &quot;flow-trunk&quot;);
      [&quot;memory&quot;, &quot;tasks&quot;, &quot;runs&quot;, &quot;automation&quot;, &quot;browser&quot;].forEach((id) =&gt; {
        const target = positions.get(id);
        addPath(layer, `M ${branchX} ${target.y} H ${target.x - target.w / 2}`);
      });
      connect(layer, positions, &quot;memory&quot;, &quot;memoryState&quot;);
      connect(layer, positions, &quot;memoryState&quot;, &quot;apiResult&quot;);
      connect(layer, positions, &quot;tasks&quot;, &quot;taskState&quot;);
      connect(layer, positions, &quot;taskState&quot;, &quot;uiResult&quot;);
      connect(layer, positions, &quot;runs&quot;, &quot;approval&quot;);
      connect(layer, positions, &quot;approval&quot;, &quot;approvalQueue&quot;, &quot;Yes&quot;);
      connect(layer, positions, &quot;approvalQueue&quot;, &quot;execution&quot;, &quot;Approved&quot;);
      connect(layer, positions, &quot;automation&quot;, &quot;scheduleState&quot;);
      connect(layer, positions, &quot;scheduleState&quot;, &quot;reminder&quot;);
      connect(layer, positions, &quot;browser&quot;, &quot;jobState&quot;);
      connect(layer, positions, &quot;jobState&quot;, &quot;adapter&quot;);
      const end = positions.get(&quot;end&quot;);
      const mergeX = width - 14;
      [&quot;apiResult&quot;, &quot;uiResult&quot;, &quot;execution&quot;, &quot;reminder&quot;, &quot;adapter&quot;].forEach((id) =&gt; {
        const output = positions.get(id);
        addPath(layer, `M ${output.x + output.w / 2} ${output.y} H ${mergeX}`, false, &quot;flow-trunk&quot;);
      });
      addPath(layer, `M ${mergeX} ${positions.get(&quot;apiResult&quot;).y} V ${end.y} H ${end.x + end.w / 2}`);
    }

    function drawShape(layer, node, position) {
      const selectedClass = selectedId === node.id ? &quot; is-selected&quot; : &quot;&quot;;
      let shape;
      if (node.type === &quot;start&quot;) {
        shape = el(&quot;ellipse&quot;, { cx: position.x, cy: position.y, rx: position.w / 2, ry: position.h / 2, class: `node-shape shape-start${selectedClass}` });
      } else if (node.type === &quot;decision&quot;) {
        const points = `${position.x},${position.y - position.h / 2} ${position.x + position.w / 2},${position.y} ${position.x},${position.y + position.h / 2} ${position.x - position.w / 2},${position.y}`;
        shape = el(&quot;polygon&quot;, { points, class: `node-shape shape-decision${selectedClass}` });
      } else {
        const shapeClass = node.type === &quot;state&quot; ? &quot;shape-state&quot; : node.type === &quot;output&quot; ? &quot;shape-output&quot; : node.type === &quot;end&quot; ? &quot;shape-end&quot; : node.type === &quot;reject&quot; ? &quot;shape-reject&quot; : &quot;shape-process&quot;;
        shape = el(&quot;rect&quot;, {
          x: position.x - position.w / 2, y: position.y - position.h / 2,
          width: position.w, height: position.h,
          rx: node.type === &quot;end&quot; || node.type === &quot;reject&quot; ? position.h / 2 : 6,
          class: `node-shape ${shapeClass}${selectedClass}`
        });
      }
      layer.append(shape);

      const foreign = el(&quot;foreignObject&quot;, {
        x: position.x - position.w / 2, y: position.y - position.h / 2,
        width: position.w, height: position.h
      });
      const shell = document.createElement(&quot;div&quot;);
      shell.className = &quot;node-label-shell&quot;;
      const button = document.createElement(&quot;button&quot;);
      button.type = &quot;button&quot;;
      button.className = &quot;btn btn-ghost btn-block&quot;;
      button.setAttribute(&quot;aria-expanded&quot;, selectedId === node.id &amp;&amp; !detail.hidden ? &quot;true&quot; : &quot;false&quot;);
      button.setAttribute(&quot;aria-controls&quot;, &quot;cc-kb-node-detail&quot;);
      button.textContent = `${node.label} ${selectedId === node.id &amp;&amp; !detail.hidden ? &quot;−&quot; : &quot;+&quot;}`;
      button.addEventListener(&quot;click&quot;, () =&gt; showDetail(node.id));
      shell.append(button);
      foreign.append(shell);
      layer.append(foreign);
    }

    function draw() {
      const width = Math.max(300, Math.round(root.getBoundingClientRect().width));
      const compact = width &lt; 620;
      const height = compact ? 2260 : 970;
      svg.replaceChildren();
      svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
      svg.setAttribute(&quot;height&quot;, String(height));

      const title = el(&quot;title&quot;, { id: &quot;cc-flow-svg-title&quot; });
      title.textContent = &quot;CC Assistant knowledge-base swimlane flowchart&quot;;
      const description = el(&quot;desc&quot;, { id: &quot;cc-flow-svg-desc&quot; });
      description.textContent = &quot;Requests flow from interfaces through daemon authentication and validation, branch into five domain engines, persist durable state, and return live or external outcomes.&quot;;
      svg.append(title, description);

      const defs = el(&quot;defs&quot;);
      const marker = el(&quot;marker&quot;, { id: &quot;cc-flow-arrow&quot;, viewBox: &quot;0 0 10 10&quot;, refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: &quot;auto-start-reverse&quot; });
      marker.append(el(&quot;path&quot;, { d: &quot;M 0 0 L 10 5 L 0 10 z&quot;, fill: &quot;var(--muted-foreground)&quot; }));
      defs.append(marker);
      svg.append(defs);

      const laneLayer = el(&quot;g&quot;);
      const edgeLayer = el(&quot;g&quot;);
      const nodeLayer = el(&quot;g&quot;);
      svg.append(laneLayer, edgeLayer, nodeLayer);

      if (!compact) {
        const laneWidth = width / 5;
        laneLayer.append(el(&quot;rect&quot;, { x: 0.5, y: 0.5, width: width - 1, height: 28, class: &quot;org-header&quot; }));
        const orgLabel = el(&quot;text&quot;, { x: width / 2, y: 19, class: &quot;org-label&quot;, &quot;text-anchor&quot;: &quot;middle&quot; });
        orgLabel.textContent = &quot;CC Assistant&quot;;
        laneLayer.append(orgLabel);
        lanes.forEach((lane, index) =&gt; {
          laneLayer.append(el(&quot;rect&quot;, { x: index * laneWidth + 0.5, y: 28.5, width: laneWidth, height: 30, class: &quot;lane-header&quot; }));
          laneLayer.append(el(&quot;rect&quot;, { x: index * laneWidth + 0.5, y: 58.5, width: laneWidth, height: height - 59, class: `lane-body${index % 2 ? &quot; lane-alt&quot; : &quot;&quot;}` }));
          const laneText = el(&quot;text&quot;, { x: index * laneWidth + laneWidth / 2, y: 48, class: &quot;lane-label&quot;, &quot;text-anchor&quot;: &quot;middle&quot; });
          laneText.textContent = lane;
          laneLayer.append(laneText);
        });
      } else {
        const stageYs = [[&quot;Interfaces&quot;, 26], [&quot;Daemon gateway&quot;, 190], [&quot;Domain engines&quot;, 500], [&quot;Durable state&quot;, 715], [&quot;Results / adapters&quot;, 795]];
        stageYs.forEach(([label, y]) =&gt; {
          const text = el(&quot;text&quot;, { x: 8, y, class: &quot;mobile-lane-label&quot; });
          text.textContent = label;
          laneLayer.append(text);
        });
      }

      const positions = new Map(nodes.map((node) =&gt; [node.id, nodePosition(node.id, width, compact)]));
      if (compact) drawCompactEdges(edgeLayer, positions, width);
      else drawWideEdges(edgeLayer, positions, width);
      nodes.forEach((node) =&gt; drawShape(nodeLayer, node, positions.get(node.id)));
    }

    const resizeObserver = new ResizeObserver(() =&gt; {
      cancelAnimationFrame(frameToken);
      frameToken = requestAnimationFrame(draw);
    });
    resizeObserver.observe(root);
    detail.id = &quot;cc-kb-node-detail&quot;;
    showDetail(&quot;memory&quot;);
  })();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

<script>(() => {

  if (!(frame instanceof HTMLIFrameElement)) {

  const channel = new MessageChannel();

    const data = event.data;

        typeof height === "number" &&
        Number.isFinite(height) &&

        frame.style.height = Math.ceil(height) + "px";
